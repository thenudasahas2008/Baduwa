<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#3b0764"/>
      <stop offset="80%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#86198f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#bgGrad)"/>

  <!-- Fluid Cyber Waves -->
  <path d="M 0 160 C 200 130, 380 200, 560 170 C 740 140, 880 180, 1000 150 L 1000 240 L 0 240 Z" fill="url(#wave1Grad)"/>
  <path d="M 0 185 C 240 155, 420 220, 620 185 C 800 150, 900 195, 1000 175 L 1000 240 L 0 240 Z" fill="url(#wave2Grad)"/>

  <!-- Headphones & Audio Beat Icon -->
  <g transform="translate(500, 60)" text-anchor="middle" filter="url(#musicGlow)">
    <!-- Headphone Band -->
    <path d="M -22 6 C -24 -14, 24 -14, 22 6" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Earcup -->
    <rect x="-26" y="2" width="8" height="16" rx="4" fill="#a855f7" stroke="#e879f9" stroke-width="1.5"/>
    <!-- Right Earcup -->
    <rect x="18" y="2" width="8" height="16" rx="4" fill="#a855f7" stroke="#e879f9" stroke-width="1.5"/>
    <!-- Center Music Note -->
    <circle cx="-3" cy="8" r="3" fill="#f43f5e"/>
    <circle cx="5" cy="5" r="3" fill="#f43f5e"/>
    <path d="M 0 8 L 0 -1 L 8 -4 L 8 5" fill="none" stroke="#f43f5e" stroke-width="2"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    BADUWA MUSIC BOT
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#fbcfe8" letter-spacing="0.5">
    24/7 Discord Music Engine • ZYRO-Style Interactive UI • Autoplay
  </text>
</svg>
